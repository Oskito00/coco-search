{% extends "base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/contact_feedback.css') }}">
{% endblock %}

{% block content %}
<div class="contact-container">
    <!-- Flash Messages Section -->

    <div class="contact-header">
        <h1 class="contact-title">Get in Touch</h1>
        <p class="contact-subtitle">We'd love to hear from you</p>
    </div>

    <div class="contact-grid">
        <!-- Direct Contact Card -->
        <div class="contact-card">
            <div class="contact-info">
                <h2>Direct Contact</h2>
                <div class="social-links">
                    <a href="mailto:cocosupport@gmail.com" class="social-link">
                    <svg class="social-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8l8 5 8-5v10zm-8-7L4 6h16l-8 5z"/></svg>
                        cocosearchhelp@gmail.com
                    </a>
                </div>
                <div class="social-links">
                    <a href="https://twitter.com/cocosearchsupport" target="_blank" class="social-link">
                        <svg class="social-icon" viewBox="0 0 24 24"><path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C10.28 9.09 7.11 7.38 5 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.03c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/></svg>
                        @cocosearchsupport
                    </a>
                </div>
            </div>
        </div>

        <!-- Feedback Form -->
        <div class="feedback-card">
            <form class="feedback-form" method="POST" action="{{ url_for('contact_feedback.submit_feedback') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="email">Your Email (optional)</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label>Rating</label>
                    <div class="star-rating-container">
                        <input type="hidden" name="rating" value="0">
                        <div class="star-rating">
                            {% for i in range(5, 0, -1) %}
                                <input type="radio" id="star{{i}}" name="rating" value="{{i}}">
                            <label for="star{{i}}" class="star">★</label>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Feedback
                    <svg class="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
